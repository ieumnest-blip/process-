<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAhN6R4Fl18rLYSNTIKy2EOtrg2AjomjW4",
    authDomain: "process-note-b9fc9.firebaseapp.com",
    projectId: "process-note-b9fc9",
    storageBucket: "process-note-b9fc9.firebasestorage.app",
    messagingSenderId: "91360712685",
    appId: "1:91360712685:web:8ba1edbc6b2024ce48b9e4",
    measurementId: "G-Q3KG4K61XJ"
  };

  const fbApp = initializeApp(firebaseConfig);
  const db = getFirestore(fbApp);
  const docRef = doc(db, "buildingSupportTracker", "mainData");

  let fbSaveTimer = null;

  // 원격(다른 기기/탭) 변경 실시간 반영 — 내 쓰기가 서버에 반영되기 전(hasPendingWrites)에는 무시해서 에코를 방지
  window.fbSubscribe = (onRemoteUpdate) => {
    onSnapshot(docRef, (snap) => {
      if (!snap.exists() || snap.metadata.hasPendingWrites) return;
      onRemoteUpdate(snap.data());
    }, (err) => console.error('Firestore 동기화 오류', err));
  };

  window.fbGetOnce = async () => {
    try {
      const snap = await getDoc(docRef);
      return snap.exists() ? snap.data() : null;
    } catch (e) { console.error('Firestore 로드 실패', e); return null; }
  };

  // 잦은 저장 호출을 묶어서 Firestore에 반영 (짧은 디바운스)
  window.fbSaveData = (payload) => {
    clearTimeout(fbSaveTimer);
    fbSaveTimer = setTimeout(async () => {
      try { await setDoc(docRef, { ...payload, _updatedAt: Date.now() }); }
      catch (e) { console.error('Firestore 저장 실패', e); }
    }, 500);
  };

  // 모듈 스크립트는 defer로 실행되어 아래 classic 스크립트보다 늦게 준비될 수 있으므로 준비 완료를 알림
  window.dispatchEvent(new Event('fb-ready'));
</script>

const SAVE_KEY='bst_data_v2';
let lastSyncedAt=0; // 이 기기에서 마지막으로 반영된 데이터의 시각(로컬 저장 or 원격 수신)

function saveAll(){
  lastSyncedAt=Date.now();
  const payload={data,nid,siteInfo,siteMemo,siteAdvE,siteGrE,selYear};
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({...payload,_updatedAt:lastSyncedAt}));}catch(e){}
  if(window.fbSaveData)window.fbSaveData(payload);
}
function loadAll(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(raw){
      const o=JSON.parse(raw);
      if(o.data&&o.data.length){
        data=o.data;nid=o.nid||200;siteInfo=o.siteInfo||{};siteMemo=o.siteMemo||{};siteAdvE=o.siteAdvE||{};siteGrE=o.siteGrE||{};selYear=o.selYear||TY;
        lastSyncedAt=o._updatedAt||0;
        return true;
      }
    }
  }catch(e){}
  return false;
}
function applyRemote(o){
  if(!o||!o.data||!o.data.length)return;
  data=o.data;nid=o.nid||200;siteInfo=o.siteInfo||{};siteMemo=o.siteMemo||{};siteAdvE=o.siteAdvE||{};siteGrE=o.siteGrE||{};selYear=o.selYear||TY;
  lastSyncedAt=o._updatedAt||Date.now();
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({...o}));}catch(e){}
  render();
}
// Firestore에 더 최신 데이터가 있으면 반영 후, 이후 변경사항은 실시간 구독
function initCloudSync(){
  if(!window.fbGetOnce)return;
  window.fbGetOnce().then(remote=>{
    if(remote&&(remote._updatedAt||0)>lastSyncedAt)applyRemote(remote);
    if(window.fbSubscribe)window.fbSubscribe(remote=>{
      if((remote._updatedAt||0)>lastSyncedAt)applyRemote(remote);
    });
  });
}

  const cgp=[...s].reverse().find(i=>i.type==='착공여부 검토신청'&&i.result==='적합');
  const apReq=s.find(i=>i.type==='선급금 신청');
  const apOk=[...s].reverse().find(i=>i.type==='선급금 신청'&&i.result==='적합');
  const apPay=s.find(i=>i.type==='선급금 지급');
  const grant=s.find(i=>i.type==='보조금 지급');
  let stage='신청서 제출',sc='#9C9488';
  if(grant){stage='보조금 지급';sc='#5B2C82';}
  else if(apPay){stage='선급금 지급';sc='#7C4DA6';}

  if(apPay)advSt='지급';else if(apOk)advSt='적합';else if(apReq)advSt='신청';
  if(grant)grantSt='지급';

function parseImp(text){
  const lines=text.split('\n');let site='',items=[],cur=null;
  const dr=/^(\d{4}-\d{2}-\d{2})\s*/;
  for(let i=0;i<lines.length;i++){
    const lt=lines[i].trim();if(!lt)continue;
    if(dr.test(lt)){
      if(cur)items.push(cur);
      const p=lines[i].split('\t').map(x=>x.trim());
      cur={date:p[0]||'',type:p[1]||'',result:p[2]||'',detail:''};
    }else if(cur){cur.detail=cur.detail?(cur.detail+'\n'+lt):lt;}
    else if(!site){site=lt;}
  }
  if(cur)items.push(cur);
  items.forEach(it=>{
    it.detail=(it.detail||'').replace(/^ㅇ\s*/gm,'').trim();
    if(!it.type&&it.detail){
      if(it.detail.includes('선급금 지급'))it.type='선급금 지급';
      else if(it.detail.includes('보조금 지급'))it.type='보조금 지급';
      else if(it.detail.includes('선급금 신청'))it.type='선급금 신청';
    }
    if(!it.type)it.type='신청서 제출';
    if(!it.detail)it.detail=it.type;
  });
  return{site,items};
}

function fixCalH(){
  const ct=document.getElementById('ct');if(!ct)return;

  const top=grids[0].getBoundingClientRect().top;
  const avail=window.innerHeight-top-16;
  // find max rows across both months (excluding header row)
  let maxRows=0;
  grids.forEach(g=>{
    const totalCells=g.querySelectorAll('.cal-c').length;
    const rows=Math.ceil(totalCells/7);
    if(rows>maxRows)maxRows=rows;
  });
  if(!maxRows)maxRows=5;
  const rowH=Math.max(50,Math.floor(avail/maxRows));
  // set grid-template-rows on each grid so all rows are equal
  grids.forEach(g=>{
    g.style.gridTemplateRows='auto repeat('+maxRows+','+rowH+'px)';
    // pad extra empty cells if this month has fewer rows
    const totalCells=g.querySelectorAll('.cal-c').length;
    const rows=Math.ceil(totalCells/7);
    const need=maxRows*7-totalCells;
    for(let i=0;i<need;i++){const d=document.createElement('div');d.className='cal-c empty';g.appendChild(d);}
  });
}

      <td>${r.bc>0?`<b style="color:${r.bc>=3?'#B23A2A':'#9C6414'}">${r.bc}회</b>`:'<span style="color:#C9C2B5">0</span>'}</td>
      <td><span class="stg" style="background:${r.sc}18;color:${r.sc}">${r.stage}</span></td>
      <td><span style="color:${advC};font-weight:600">${r.advSt}</span></td>
      <td ondblclick="openE(this,'advE','${esc(r.site)}')"><span class="memo-cell ${advE?'has':''}" id="mc-advE-${esc(r.site)}">${advE?esc(advE):''}</span><input class="memo-inp" id="mi-advE-${esc(r.site)}" value="${esc(advE)}" onblur="closeE('advE','${esc(r.site)}',this)" onkeydown="if(event.key==='Enter')this.blur()"></td>
      <td><span style="color:${grC};font-weight:600">${r.grantSt}</span></td>
      <td ondblclick="openE(this,'grE','${esc(r.site)}')"><span class="memo-cell ${grE?'has':''}" id="mc-grE-${esc(r.site)}">${grE?esc(grE):''}</span><input class="memo-inp" id="mi-grE-${esc(r.site)}" value="${esc(grE)}" onblur="closeE('grE','${esc(r.site)}',this)" onkeydown="if(event.key==='Enter')this.blur()"></td>
    </tr>`;
  });
  h+='</tbody></table></div>';return h;
}

function rCal(fl){
  // render 4 months: cm-1, cm, cm+1, cm+2
  const months=[];
  for(let i=-1;i<=2;i++){
    let mm=cm+i,yy=cy;
    while(mm<0){mm+=12;yy--;}
    while(mm>11){mm-=12;yy++;}
    months.push({y:yy,m:mm});
  }
  let h=`<div class="cal-nav">
    <button class="btn btn-s" onclick="cp()">◀</button>
    <span class="cal-title">${cy}년 ${MS[cm]}</span>
    <button class="btn btn-s" onclick="cn()">▶</button>
  </div><div class="cal-scroll" id="cal-sc"><div class="cal-wrap">`;
  months.forEach(({y,m})=>{h+=rMon(y,m,fl);});
  h+='</div></div>';
  return h;
}

function scrollCalToCenter(){
  const sc=document.getElementById('cal-sc');if(!sc)return;
  const halves=sc.querySelectorAll('.cal-half');
  if(halves.length>=2){
    const target=halves[1];
    sc.scrollLeft=target.offsetLeft-8;
  }
}

function rMon(y,m,fl){
  const fd=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  let cells=[];for(let i=0;i<fd;i++)cells.push(null);for(let d=1;d<=dim;d++)cells.push(d);
  // pad to complete last row
  while(cells.length%7!==0)cells.push(null);
  const hol=getHol(y,m);
  let h=`<div class="cal-half"><div style="text-align:center;font-weight:700;font-size:23px;margin-bottom:6px;color:#1B4B4A">${y}년 ${MS[m]}</div>
  <div class="cal-grid">`;
  WD.forEach(d=>{h+=`<div class="cal-dh" style="color:${d==='일'?'#B23A2A':d==='토'?'#1B4B4A':'#6B6459'}">${d}</div>`;});
  cells.forEach((day,i)=>{
    if(day===null){h+=`<div class="cal-c empty"></div>`;return;}
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const evts=fl.filter(x=>x.date===ds);
    const dow=i%7;const nc=dow===0?'#B23A2A':dow===6?'#1B4B4A':'#4A443C';
    const hn=hol[day];
    h+=`<div class="cal-c"><div class="cal-n" style="color:${hn?'#B23A2A':nc}">${day}${hn?`<span class="holiday">${hn}</span>`:''}</div>`;
    evts.slice(0,4).forEach(ev=>{
      const bg=ev.result==='적합'?'#E3F3E9':ev.result==='보완요청'?'#FBF0DC':ev.result==='반려'?'#FAE4E1':'#E4F0F6';
      const tx=ev.result==='적합'?'#2F8F5B':ev.result==='보완요청'?'#9C6414':ev.result==='반려'?'#B23A2A':'#2E6E92';
      const st=shortType(ev.type);
      const rs=ev.result?(' '+ev.result):'';
      h+='<div class="cal-ev" style="background:'+bg+';color:'+tx+'" onclick="showEdit('+ev.id+')">'+ev.site+' '+st+rs+'<\/div>';
    });
    if(evts.length>4)h+='<div style="font-size:23px;color:#9C9488">+'+String(evts.length-4)+'<\/div>';
    h+='<\/div>';
  });
  h+='</div></div>';return h;
}

function getHol(y,m){
  const h={};
  const f={0:{1:'신정'},2:{1:'삼일절'},4:{5:'어린이날'},5:{6:'현충일'},7:{15:'광복절'},9:{3:'개천절',9:'한글날'},11:{25:'성탄절'}};
  if(f[m])Object.entries(f[m]).forEach(([d,n])=>{h[parseInt(d)]=n;});
  if(y===2026&&m===8){h[24]='추석연휴';h[25]='추석';h[26]='추석연휴';}
  if(y===2026&&m===1){h[16]='설연휴';h[17]='설날';h[18]='설연휴';}
  if(y===2026&&m===4){h[24]='석가탄신일';}
  if(y===2026&&m===7){h[17]='임시공휴일';}
  return h;
}

function rSite(fl){
  const sm={};fl.forEach(i=>{if(!sm[i.site])sm[i.site]=[];sm[i.site].push(i);});
  let h='';Object.entries(sm).forEach(([site,items])=>{
    items.sort((a,b)=>a.date.localeCompare(b.date));const st=calcS(items);
    h+=`<div class="sec"><div class="sec-hdr"><div><span class="sec-name">${site}</span><span class="stg" style="background:${st.sc}18;color:${st.sc};margin-left:8px">${st.stage}</span></div><span style="font-size:20px;color:#9C9488">${items.length}건</span></div>
    <div class="sec-dur">${st.s2b!==null?`<span>제출→보완 <b style="color:#9C6414">${st.s2b}일</b></span>`:''}${st.s2a!==null?`<span>제출→적합 <b style="color:#2F8F5B">${st.s2a}일</b></span>`:''}${st.bc>0?`<span>보완 <b style="color:#9C6414">${st.bc}회</b></span>`:''}</div>`;
    items.forEach(it=>{h+=rCard(it);});h+='</div>';
  });return h;
}

function rDate(fl){
  const dm={};fl.forEach(i=>{if(!dm[i.date])dm[i.date]=[];dm[i.date].push(i);});
  let h='';Object.entries(dm).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([date,items])=>{
    h+=`<div class="sec"><div class="sec-hdr"><span>${date} (${WD[new Date(date).getDay()]})</span><span style="font-size:20px;color:#9C9488">${items.length}건</span></div>`;
    items.forEach(it=>{h+=rCard(it);});h+='</div>';
  });return h;
}

function rCard(it){
  const short=['적합','신청서 제출','검토완료','사업계획서 검토신청','선급금 신청','선급금 지급','보조금 지급'];
  const sd=it.detail&&!short.includes(it.detail);
  return`<div class="card ${cc2(it.result)}" onclick="showEdit(${it.id})">
    <div class="card-top"><span class="card-date">${it.date}</span><span class="badge ${bc2(it.result)}">${bl(it.result)}</span></div>
    <div class="card-site">${it.site}</div><div class="card-type">${it.type}</div>
    ${sd?`<div class="card-detail">${esc(it.detail)}</div>`:''}
  </div>`;
}

window.sv=v=>{cv=v;render();};
window.chgYear=y=>{selYear=y;sf.clear();render();};
window.ff=v=>{sf=new Set([v]);render();};
window.onSearch=v=>{
  const drop=document.getElementById('searchDrop');
  const sites=gs();
  const q=v.trim().toLowerCase();
  const filtered=q?sites.filter(s=>s.toLowerCase().includes(q)):sites;
  drop.innerHTML=filtered.map(s=>{
    const sel=s==='전체'?sf.size===0:sf.has(s);
    return '<div class="search-item'+(sel?' sel':'')+'" onclick="pickSite(\''+s.replace(/'/g,"\\'")+'\')">'+
      (sel?'✓ ':'')+s+'</div>';
  }).join('');
  drop.classList.add('open');
};
window.openSearch=()=>{onSearch(document.getElementById('searchInp').value);};
window.pickSite=s=>{
  if(s==='전체'){sf.clear();}
  else{if(sf.has(s))sf.delete(s);else sf.add(s);}
  document.getElementById('searchInp').value='';
  render();
  setTimeout(()=>{const inp=document.getElementById('searchInp');if(inp){inp.focus();openSearch();}},50);
};
window.removeSite=s=>{sf.delete(s);render();};
window.clearFilter=()=>{sf.clear();render();};
document.addEventListener('click',e=>{
  const w=document.querySelector('.search-wrap');
  if(w&&!w.contains(e.target)){const d=document.getElementById('searchDrop');if(d)d.classList.remove('open');}
});
window.cp=()=>{if(cm===0){cy--;cm=11;}else cm--;render();};
window.cn=()=>{if(cm===11){cy++;cm=0;}else cm++;render();};
window.doSort=c=>{if(sortCol===c)sortDir*=-1;else{sortCol=c;sortDir=1;}render();};
window.chgNum=(s,v)=>{if(!siteInfo[s])siteInfo[s]={num:v,round:1,year:selYear};else siteInfo[s].num=v;saveAll();};
window.chgMemo=(s,v)=>{siteMemo[s]=v;saveAll();};
window.openMemo=(td,s)=>{
  const inp=document.getElementById('mi-'+s);if(!inp)return;
  const cell=document.getElementById('mc-'+s);if(cell)cell.style.display='none';
  inp.classList.add('show');inp.focus();
};
window.closeMemo=(s,inp)=>{
  siteMemo[s]=inp.value;inp.classList.remove('show');
  const cell=document.getElementById('mc-'+s);
  if(cell){cell.style.display='';cell.textContent=inp.value;cell.className='memo-cell'+(inp.value?' has':'');}
  saveAll();
};
window.openE=(td,key,s)=>{
  const inp=document.getElementById('mi-'+key+'-'+s);if(!inp)return;
  const cell=document.getElementById('mc-'+key+'-'+s);if(cell)cell.style.display='none';
  inp.classList.add('show');inp.focus();
};
window.closeE=(key,s,inp)=>{
  if(key==='advE')siteAdvE[s]=inp.value;else siteGrE[s]=inp.value;
  inp.classList.remove('show');
  const cell=document.getElementById('mc-'+key+'-'+s);
  if(cell){cell.style.display='';cell.textContent=inp.value;cell.className='memo-cell'+(inp.value?' has':'');}
  saveAll();
};

window.showEdit=id=>{
  const it=data.find(d=>d.id===id);if(!it)return;
  const inf=siteInfo[it.site]||{round:1,year:selYear};
  const ov=document.createElement('div');ov.className='ov';ov.onclick=e=>{if(e.target===ov)ov.remove();};
  ov.innerHTML=`<div class="modal"><h3>항목 수정</h3>
    <label>현장명<input id="es" value="${it.site}"></label>
    <label>연도<input type="number" id="ey" value="${inf.year||selYear}" min="2020" max="2040" style="width:120px"></label>
    <label>차수<select id="er"><option value="1" ${inf.round===1?'selected':''}>1차</option><option value="2" ${inf.round===2?'selected':''}>2차</option></select></label>
    <label>날짜<input type="date" id="ed" value="${it.date}"></label>
    <label>항목<select id="et">${TYPES.map(t=>`<option ${it.type===t?'selected':''}>${t}</option>`).join('')}</select></label>
    <label>결과<select id="ek"><option value="">없음</option><option value="적합" ${it.result==='적합'?'selected':''}>적합</option><option value="보완요청" ${it.result==='보완요청'?'selected':''}>보완요청</option><option value="반려" ${it.result==='반려'?'selected':''}>반려</option></select></label>
    <label>내역<textarea id="ei" rows="3">${esc(it.detail)}</textarea></label>
    <div class="ma"><button class="btn btn-d" onclick="delI(${id})">삭제</button><div style="display:flex;gap:6px"><button class="btn btn-c" onclick="this.closest('.ov').remove()">취소</button><button class="btn btn-sv" onclick="saveI(${id})">저장</button></div></div></div>`;
  document.body.appendChild(ov);
};
window.saveI=id=>{
  const it=data.find(d=>d.id===id);const ns=document.getElementById('es').value;
  if(ns!==it.site&&siteInfo[it.site]){siteInfo[ns]=siteInfo[it.site];}
  it.site=ns;it.date=document.getElementById('ed').value;it.type=document.getElementById('et').value;it.result=document.getElementById('ek').value;it.detail=document.getElementById('ei').value;
  const rnd=parseInt(document.getElementById('er').value);
  const yr=parseInt(document.getElementById('ey').value)||selYear;
  if(!siteInfo[ns])siteInfo[ns]={num:'',round:rnd,year:yr};else{siteInfo[ns].round=rnd;siteInfo[ns].year=yr;}
  document.querySelector('.ov').remove();saveAll();render();
};
window.delI=id=>{if(!confirm('삭제?'))return;data=data.filter(d=>d.id!==id);document.querySelector('.ov').remove();saveAll();render();};

window.showAdd=()=>{
  const ov=document.createElement('div');ov.className='ov';ov.onclick=e=>{if(e.target===ov)ov.remove();};
  ov.innerHTML=`<div class="modal"><h3>새 항목 추가</h3>
    <label>현장명<input id="es" value="${sf.size===1?[...sf][0]:''}"></label>
    <label>연도<input type="number" id="ey" value="${selYear}" min="2020" max="2040" style="width:120px"></label>
    <label>차수<select id="er"><option value="1">1차</option><option value="2">2차</option></select></label>
    <label>날짜<input type="date" id="ed" value="${new Date().toISOString().slice(0,10)}"></label>
    <label>항목<select id="et">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></label>
    <label>결과<select id="ek"><option value="">없음</option><option value="적합">적합</option><option value="보완요청">보완요청</option><option value="반려">반려</option></select></label>
    <label>내역<textarea id="ei" rows="3"></textarea></label>
    <div class="ma"><div></div><div style="display:flex;gap:6px"><button class="btn btn-c" onclick="this.closest('.ov').remove()">취소</button><button class="btn btn-sv" onclick="addI()">추가</button></div></div></div>`;
  document.body.appendChild(ov);
};
window.addI=()=>{
  const s=document.getElementById('es').value.trim();if(!s){alert('현장명 입력');return;}
  const rnd=parseInt(document.getElementById('er').value);
  const yr=parseInt(document.getElementById('ey').value)||selYear;
  data.push({id:nid++,site:s,date:document.getElementById('ed').value,type:document.getElementById('et').value,result:document.getElementById('ek').value,detail:document.getElementById('ei').value||document.getElementById('et').value});
  if(!siteInfo[s]){const rndSites=Object.values(siteInfo).filter(x=>x.round===rnd&&x.year===yr).length+1;siteInfo[s]={num:yr+'-'+rnd+'-'+String(rndSites).padStart(2,'0'),round:rnd,year:yr};}else{siteInfo[s].round=rnd;siteInfo[s].year=yr;}
  selYear=yr;
  document.querySelector('.ov').remove();saveAll();render();
};

window.showImp=()=>{
  const ov=document.createElement('div');ov.className='ov';ov.onclick=e=>{if(e.target===ov)ov.remove();};
  ov.innerHTML=`<div class="modal"><h3>데이터 입력 (붙여넣기)</h3>
    <p class="imp-hint"><b>형식:</b> 첫 줄에 현장명, 이후 줄에 날짜(탭)항목(탭)결과 + 다음줄 내역<br><br>
    <b>예시:</b><br>
    <code style="background:#FAF8F4;padding:6px 10px;display:block;border-radius:6px;font-size:20px;line-height:1.8;color:#4A443C">진양<br>2026-08-03&nbsp;&nbsp;&nbsp;선급금 신청&nbsp;&nbsp;&nbsp;적합<br>적합</code></p>
    <label>연도<input type="number" id="imp-y" value="${selYear}" min="2020" max="2040" style="width:120px"></label>
    <label>차수<select id="imp-r"><option value="1">1차</option><option value="2">2차</option></select></label>
    <textarea class="imp-area" id="imp-t" placeholder="진양&#10;2026-08-03&#9;선급금 신청&#9;적합&#9;&#10;적합"></textarea>
    <div id="imp-pv"></div>
    <div class="ma"><div></div><div style="display:flex;gap:6px"><button class="btn" style="background:#FCE9E1;color:#B85128" onclick="pvImp()">미리보기</button><button class="btn btn-sv" onclick="doImp()">등록</button></div></div></div>`;
  document.body.appendChild(ov);
};
window.pvImp=()=>{
  const{site,items}=parseImp(document.getElementById('imp-t').value);
  const pv=document.getElementById('imp-pv');
  if(!site&&!items.length){pv.innerHTML='<div class="imp-pv" style="color:#B23A2A">결과 없음</div>';return;}
  const ex=data.filter(d=>d.site===site);
  let h=`<div class="imp-pv"><b>${site||'(미입력)'}</b> — ${items.length}건<br>`;
  items.forEach(it=>{
    const dup=ex.some(e=>e.date===it.date&&e.type===it.type&&e.result===it.result);
    h+=`<span style="color:${dup?'#B23A2A':'#4A443C'}">${dup?'[중복] ':''}${it.date} | ${it.type} | ${bl(it.result)}</span><br>`;
  });h+='</div>';pv.innerHTML=h;
};
window.doImp=()=>{
  const{site,items}=parseImp(document.getElementById('imp-t').value);
  if(!site){alert('현장명(첫 줄) 입력');return;}
  if(!items.length){alert('항목 없음');return;}
  const rnd=parseInt(document.getElementById('imp-r').value);
  const ex=data.filter(d=>d.site===site);let added=0;
  items.forEach(it=>{
    if(!ex.some(e=>e.date===it.date&&e.type===it.type&&e.result===it.result)){
      data.push({id:nid++,site,date:it.date,type:it.type,result:it.result,detail:it.detail||it.type});added++;
    }
  });
  const yr=parseInt(document.getElementById('imp-y').value)||selYear;
  if(!siteInfo[site]){const rndSites=Object.values(siteInfo).filter(x=>x.round===rnd&&x.year===yr).length+1;siteInfo[site]={num:yr+'-'+rnd+'-'+String(rndSites).padStart(2,'0'),round:rnd,year:yr};}else{siteInfo[site].round=rnd;siteInfo[site].year=yr;}
  selYear=yr;
  document.querySelector('.ov').remove();saveAll();render();
  alert(site+' — '+added+'건 등록'+(items.length-added>0?' (중복 '+(items.length-added)+'건 제외)':''));
};

window.addEventListener('resize',()=>{if(cv==='calendar'){fixCalH();scrollCalToCenter();}});

// ── 데이터 백업/복원 ──
window.exportData=()=>{
  const blob=new Blob([JSON.stringify({data,nid,siteInfo,siteMemo,siteAdvE,siteGrE,selYear},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const d=new Date();
  a.download='건물지원사업_백업_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
  a.click();URL.revokeObjectURL(a.href);
};

window.importBackup=()=>{
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const o=JSON.parse(ev.target.result);
        if(!o.data||!o.data.length){alert('유효하지 않은 백업 파일');return;}
        if(!confirm('현재 데이터를 백업 파일로 교체합니다. 진행할까요?'))return;
        data=o.data;nid=o.nid||200;siteInfo=o.siteInfo||{};siteMemo=o.siteMemo||{};siteAdvE=o.siteAdvE||{};siteGrE=o.siteGrE||{};selYear=o.selYear||TY;
        saveAll();render();
        alert('복원 완료! ('+data.length+'건)');
      }catch(err){alert('파일 읽기 오류: '+err.message);}
    };
    reader.readAsText(file);
  };
  inp.click();
};

// 페이지 닫기 전 자동 저장
window.addEventListener('beforeunload',()=>{saveAll();});

render();

if(window.fbGetOnce)initCloudSync();
else window.addEventListener('fb-ready',initCloudSync,{once:true});
