<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>현장 서류함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
<style>
/* 배치: 한 줄 세로 흐름(현장 목록 → 현장 → 서류 종류 탭 → 항목), 휴대폰 우선, 넓은 화면은 가운데 720px */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#f6f8fa; --ink:#1b2530; --muted:#627080; --line:#d6dde5;
  --accent:#23529c; --accent-soft:#e3ebf7; --ok:#1d7a4b; --ok-soft:#e1f2e8; --no:#bf3426; --no-soft:#f9e4e1;
  --shadow:0 1px 2px rgba(20,35,55,.06),0 4px 14px rgba(20,35,55,.05);
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e3e9ef; --muted:#93a1af; --line:#2b3642;
  --accent:#86aef0; --accent-soft:#1f2d42; --ok:#55c48c; --ok-soft:#173326; --no:#f27b6e; --no-soft:#3a1e1b;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e3e9ef; --muted:#93a1af; --line:#2b3642;
  --accent:#86aef0; --accent-soft:#1f2d42; --ok:#55c48c; --ok-soft:#173326; --no:#f27b6e; --no-soft:#3a1e1b;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--no)}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-width:0}
textarea.field{resize:vertical;min-height:44px}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.row>.field{flex:1}
.back{font-size:14px;color:var(--accent);background:none;border:0;padding:4px 0;font-weight:500}
.muted{color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;color:var(--muted);background:var(--sunk)}
.label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}

/* 현장 목록 */
.sites{display:flex;flex-direction:column;gap:8px;list-style:none;padding:0;margin:0}
.site{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.site:hover{border-color:var(--accent)}
.site .nm{font-weight:600;font-size:16px}
.sline{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sline .cnt{font-family:var(--f-num);font-size:13px;color:var(--muted);white-space:nowrap}
.sline .cnt b{color:var(--ok);font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.opt{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface);cursor:pointer}
.opt.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.opt input{margin:0;accent-color:var(--accent)}
.site .memo{font-size:13px;color:var(--muted);white-space:pre-wrap;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.chip b{font-family:var(--f-num);font-weight:500;color:var(--ink)}
.chip.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.done b{color:var(--ok)}

/* 현장 머리 */
.head{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.sname{font-size:20px;font-weight:700;border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 6px;margin-left:-6px;width:100%;min-width:0}
.sname:hover,.sname:focus{border-color:var(--line);background:var(--sunk)}
.smemo{border:1px solid transparent;background:var(--sunk);border-radius:8px;padding:7px 9px;width:100%;resize:vertical;min-height:38px;font-size:14px;color:var(--ink)}
.smemo:focus{border-color:var(--line)}

/* 탭 */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.tab .n{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tab.on .n{color:var(--surface);opacity:.75}
.tab.add{border-style:dashed;color:var(--muted)}

/* 진행 */
.bar{display:flex;flex-direction:column;gap:6px}
.track{height:6px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .v{background:var(--ok)} .track .x{background:var(--no);opacity:.55}
.stat{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.stat b{font-family:var(--f-num);font-weight:500;color:var(--ink)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* 항목 */
.items{list-style:none;padding:0;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.item{border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.irow{display:flex;align-items:flex-start;gap:8px;padding:10px 10px 10px 12px}
.ck{flex:none;width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-family:var(--f-num);font-size:15px;color:var(--muted)}
.ck.v.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ck.x.on{background:var(--no);border-color:var(--no);color:var(--surface)}
.ttl{flex:1;min-width:0;text-align:left;background:none;border:0;padding:5px 2px;display:flex;flex-direction:column;gap:2px}
.ttl .t{font-weight:500;word-break:keep-all;overflow-wrap:anywhere}
.item.x .ttl .t{text-decoration:line-through;text-decoration-color:var(--no);text-decoration-thickness:2px;color:var(--muted)}
.item.v .ttl .t{color:var(--ok)}
.ttl .mp{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.bd{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.bd.own{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.mv{display:flex;flex-direction:column;gap:4px}
.mv .btn{padding:2px 9px}
.detail{padding:4px 12px 14px 12px;margin-left:84px;display:flex;flex-direction:column;gap:12px}
@media (max-width:480px){.detail{margin-left:0}}
.box{display:flex;flex-direction:column;gap:6px}
.fh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.files{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.file{display:flex;align-items:center;gap:6px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 10px;flex-wrap:wrap}
.file .fn{flex:1;min-width:120px;font-size:14px;overflow-wrap:anywhere}
.file .fs{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.file.ex{background:var(--accent-soft);border-color:transparent}
.hiddenlist{font-size:14px}
.hiddenlist summary{cursor:pointer;color:var(--muted)}
.hiddenlist ul{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.hiddenlist li{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}

/* 설정 */
.note{font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:8px;padding:9px 12px}
.setitem .irow{align-items:center}
.setitem .field{padding:7px 9px}

/* 모달, 알림 */
.modal{position:fixed;inset:0;background:rgba(10,18,28,.55);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:12px;max-width:560px;width:100%;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.sheet.wide{max-width:900px;height:100%}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sheet .sh b{overflow-wrap:anywhere;font-size:15px}
.sheet .sb{padding:16px;overflow:auto;flex:1}
.sheet .sf{display:flex;justify-content:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.pv{display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--sunk)}
.pv img,.pv canvas{max-width:100%;height:auto;background:#fff;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.ck,.tab,.btn{transition:background .12s,border-color .12s,color .12s}}

/* 손글씨 안내문 느낌: 남색 제목판 + 노란 글씨, 파란 테두리 카드, 파스텔 딱지 */
:root{--f-body:"Gaegu","Nanum Pen Script","Apple SD Gothic Neo","Malgun Gothic",cursive,sans-serif;--f-num:var(--f-body);
  --bg:#f3f6fc;--surface:#ffffff;--sunk:#f6f9ff;--ink:#1c2a4a;--muted:#5c6b86;--line:#c9d6ee;
  --accent:#2f6fd0;--accent-soft:#dfeafc;--navy:#22336b;--navy-line:#16224d;--gold:#ffd23f;--orange:#e8820c;
  --ok:#1f8a52;--ok-soft:#e2f4e8;--no:#d6453a;--no-soft:#fdeaea;--no-line:#f2b8b3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1526;--surface:#172038;--sunk:#131b30;--ink:#e6ecfa;--muted:#9fb0cf;--line:#2c3b60;
  --accent:#7fb0ff;--accent-soft:#1e2d52;--navy:#1d2c5e;--navy-line:#3a4f90;--gold:#ffd23f;--orange:#ffab4a;
  --ok:#5fd08f;--ok-soft:#163624;--no:#ff7d72;--no-soft:#3a1d22;--no-line:#6a3038}}
:root[data-theme="dark"]{
  --bg:#0f1526;--surface:#172038;--sunk:#131b30;--ink:#e6ecfa;--muted:#9fb0cf;--line:#2c3b60;
  --accent:#7fb0ff;--accent-soft:#1e2d52;--navy:#1d2c5e;--navy-line:#3a4f90;--gold:#ffd23f;--orange:#ffab4a;
  --ok:#5fd08f;--ok-soft:#163624;--no:#ff7d72;--no-soft:#3a1d22;--no-line:#6a3038}
body{font-size:16px;line-height:1.45}
.nav{display:flex;gap:4px;border-bottom:2.5px solid var(--navy)}
.navtab{flex:1;padding:9px 8px 7px;font-size:17px;font-weight:700;background:var(--surface);border:2px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;color:var(--muted)}
.navtab.on{background:var(--navy);border-color:var(--navy);color:var(--gold)}
.cathead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cattitle{background:none;border:0;padding:2px 0;font-size:20px;font-weight:700;display:inline-flex;align-items:center;gap:8px;text-align:left;color:var(--ink)}
.cattitle:hover{color:var(--accent)}
.gcount{font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:1px 8px}
.srow{display:flex;gap:8px;align-items:stretch}
.srow>.site{flex:1;min-width:0}
.srow>.mv{justify-content:center}
@media (min-width:900px){
  .wrap[data-view="home"]{max-width:1400px}
  .wrap[data-view="home"] .sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;align-items:start}
  .wrap[data-view="home"] .site{padding:9px 12px}
  .wrap[data-view="home"] .site .nm{font-size:17px}
  .wrap[data-view="home"] .site .memo{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .wrap[data-view="home"] .chips{margin-top:6px}
  .wrap[data-view="home"] .head,.wrap[data-view="home"] .hiddenlist,.wrap[data-view="home"] #q{max-width:720px}
}
.tn{font-size:13px;color:var(--accent);white-space:pre-wrap;overflow-wrap:anywhere}
.leftbox{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:2px solid var(--orange);border-radius:12px;padding:10px 12px}
.leftbox .label{border-bottom-color:var(--orange)}
.lefttxt{font-size:15px;font-weight:700;color:var(--orange);overflow-wrap:anywhere}
.leftn{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--no-soft);border:2px solid var(--no);color:var(--no);font-size:18px;font-weight:700;vertical-align:1px;height:26px;min-width:30px;padding:0 9px;box-shadow:0 0 0 2px var(--surface)}
.leftn::before{content:"미완료";font-size:13px;margin-right:4px}
.leftn.big{flex:none;height:34px;font-size:23px;margin-left:0;padding:0 12px}
.leftn.big::before{font-size:15px}
.leftn.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.leftn.done::before{content:"완료"}
.catmemo{flex:1 1 220px;min-width:0;border:1.5px dashed var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:15px;color:var(--orange);font-weight:700;resize:none;overflow:auto;max-height:40vh;line-height:1.4}
.catmemo:focus{border-style:solid;border-color:var(--accent)}
.catmemo::placeholder{color:var(--muted);font-weight:400}
.tabs[data-sort]>.tab{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.dropzone{border:2px dashed var(--accent);border-radius:12px;padding:10px;background:var(--sunk)}
.dropzone.dropping{background:var(--accent-soft);border-style:solid}
.drophint{font-size:12px;color:var(--muted)}
@media (hover:none){.drophint{display:none}}
.setitem.x .field{text-decoration:line-through;text-decoration-color:var(--no);text-decoration-thickness:2px;color:var(--muted);background:var(--no-soft)}
.pick{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.pick label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
.pick input{margin-top:4px;accent-color:var(--accent);flex:none}
.pick .t{font-weight:700}
.pick li.x .t{text-decoration:line-through;text-decoration-color:var(--no);color:var(--muted)}
.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;flex-direction:column;gap:10px;padding-bottom:8px;margin-top:-12px;padding-top:12px}
.stick .smemo{max-height:30vh;overflow:auto}
.iback{display:none;flex:none;width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;font-weight:700;line-height:1}
@media (pointer:coarse){.stick .back{display:none}.iback{display:inline-flex;align-items:center;justify-content:center}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.pvsheet .sh{flex-wrap:wrap}
.pvtitle{display:flex;flex-direction:column;min-width:0;flex:1}
.pvinfo{font-size:13px}
.sb.pvgrid{background:var(--sunk)}
.pvhint{font-size:13px;color:var(--muted);margin-bottom:10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.thumb{display:flex;flex-direction:column;gap:6px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:8px;text-align:left}
.thumb:hover{border-color:var(--accent)}
.thumb .tcv{display:flex;align-items:center;justify-content:center;min-height:120px;width:100%}
.thumb canvas{max-width:100%;height:auto;background:#fff;box-shadow:var(--shadow)}
.thumb .tl{display:flex;flex-direction:column;width:100%;gap:2px}
.thumb .tl b{font-size:14px}
.thumb .tt{font-size:12px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.sb.pvpage{display:flex;flex-direction:column;gap:8px;padding:8px;background:var(--sunk)}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:pan-y pinch-zoom}
.pcv{display:flex;align-items:center;justify-content:center;max-width:100%;max-height:100%}
.pcv canvas{background:#fff;box-shadow:var(--shadow);max-width:100%}
.navbtn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:34px;line-height:1;opacity:.92}
.navbtn.l{left:4px}.navbtn.r{right:4px}
.navbtn:disabled{opacity:.25;cursor:default}
.pgbar{display:flex;gap:10px;align-items:baseline;justify-content:center;flex-wrap:wrap;font-size:15px}
.pgl{font-size:13px;overflow-wrap:anywhere}
.leftnames{display:block;width:100%;font-size:13px;font-weight:700;color:var(--orange);margin-top:4px;word-break:keep-all;overflow-wrap:anywhere}
.leftn{white-space:nowrap;flex:none}
.sline .nm{display:flex;align-items:center;min-width:0;flex:1}
.sline .nmt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sline .cnt{flex:none}
.hint{font-size:13px;color:var(--muted);margin-bottom:-6px}
.sites>li,.items>li{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.items>li input,.items>li textarea{-webkit-user-select:text;user-select:text}
.grip{flex:none;cursor:grab;padding:4px 6px;color:var(--muted);font-size:20px;line-height:1;touch-action:none}
.drag-ghost{opacity:.3}
.drag-chosen .site,.drag-chosen.item{outline:2px solid var(--gold)}
.drag-float{opacity:.95;box-shadow:0 10px 24px rgba(10,20,40,.25)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--navy);color:#ffffff;font-weight:700;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.savebar .btn{background:var(--surface);color:var(--ink);border-color:transparent}
.savebar .btn.pri{background:var(--gold);color:var(--navy)}

<script>
(function(){
const app=document.getElementById('app'), layer=document.getElementById('layer');
let db=null, assets=null, downloads=null;
let cats=new Map(), sites=new Map(), gotCats=false, gotSites=false, slow=false, fatal='';
const ui={tab:{}, open:null, reorder:false, adding:false, setCat:null, setOpen:null, showOff:false, q:'', homeCat:null, newCats:null, newCatsFor:null};
try{ui.homeCat=localStorage.getItem('homeCat')}catch(_){}
const inCat=(s,cid)=>!!(((s.cats||{})[cid]||{}).on);
const RAW=new Set(['application/pdf','image/png','image/jpeg','image/gif','image/webp']);
const DL_OK=new Set('gif png jpg jpeg webp mp4 webm txt json md docx pptx epub csv ttf html svg pdf xlsx zip'.split(' '));

/* ---------- 도우미 ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nid=p=>(p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const fmtSize=n=>n<1024?n+'B':n<1048576?(n/1024).toFixed(0)+'KB':(n/1048576).toFixed(1)+'MB';
const ext=n=>{const m=/\.([^.]+)$/.exec(n||'');return m?m[1].toLowerCase():''};
function toast(msg,ms){layer.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;layer.appendChild(t);clearTimeout(toast.t);toast.t=setTimeout(()=>t.remove(),ms||2600)}
function errMsg(e){const c=e&&e.code;return({quota_exceeded:'저장 공간이 가득 찼어요. 안 쓰는 서류를 지워주세요.',quota_or_state:'저장 공간이 가득 찼어요. 안 쓰는 서류를 지워주세요.',too_large:'파일이 너무 커요. 30MB 아래로 올려주세요.','permission-denied':'저장 권한이 없어요. 파이어베이스 규칙을 확인해주세요.',unavailable:'인터넷 연결을 확인해주세요.',unsupported_type:'올릴 수 없는 형식이에요.',rate_limited:'잠시 후 다시 해주세요.',declined:'저장을 취소했어요.',rejected_extension:'이 형식은 내려받을 수 없어요.',extension_not_enabled:'이 형식은 여기서 내려받을 수 없어요.',invalid_argument:'저장하지 못했어요. 이 페이지는 만든 사람만 고칠 수 있어요.'}[c])||'처리하지 못했어요. 잠시 후 다시 해주세요.'}
function confirmBox(text,ok){return new Promise(res=>{const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet" role="dialog"><div class="sb">${esc(text)}</div><div class="sf"><button class="btn" data-r="0">취소</button><button class="btn pri" data-r="1">${esc(ok||'확인')}</button></div></div>`;m.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(b||e.target===m){m.remove();res(b?b.dataset.r==='1':false)}});layer.appendChild(m);m.querySelector('[data-r="1"]').focus()})}
const scripts={};function loadScript(src){return scripts[src]||(scripts[src]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>{delete scripts[src];no(new Error('load'))};document.head.appendChild(s)}))}

/* ---------- 저장 (문서마다 한 번에 하나씩) ---------- */
const W={};
function queueWrite(path,data,delay){const w=W[path]||(W[path]={busy:false,next:null,t:null});w.next=data;clearTimeout(w.t);w.t=setTimeout(()=>flush(path),delay||0)}
async function flush(path){const w=W[path];if(!w||w.busy||!w.next)return;const d=w.next;w.next=null;w.busy=true;try{await db.doc(path).set(d)}catch(e){toast(errMsg(e))}w.busy=false;if(w.next)flush(path)}
const pending=p=>!!W[p]&&(W[p].busy||W[p].next!==null);
function strip(o){const c=clone(o);delete c.id;return c}
function mutSite(id,fn,opt){const s=clone(sites.get(id));if(!s.cats)s.cats={};fn(s);s.id=id;sites.set(id,s);if(!opt||opt.render!==false)render();queueWrite('sites/'+id,strip(s),opt&&opt.delay)}
function mutCat(id,fn,opt){const c=clone(cats.get(id));if(!c.items)c.items=[];fn(c);c.id=id;cats.set(id,c);if(!opt||opt.render!==false)render();queueWrite('cats/'+id,strip(c),opt&&opt.delay)}
function sc(s,catId){if(!s.cats[catId])s.cats[catId]={};const x=s.cats[catId];x.st=x.st||{};x.extra=x.extra||[];x.hidden=x.hidden||[];return x}
function ist(x,itemId){return x.st[itemId]||(x.st[itemId]={})}

/* ---------- 목록 합치기: 기본목차 + 현장별 수정 ---------- */
const catList=src=>[...(src||cats).values()].sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(b.name));
function merged(site,cat){
  const x=(site.cats||{})[cat.id]||{};const st=x.st||{};const hidden=new Set(x.hidden||[]);
  const all=[...(cat.items||[]).map(it=>({id:it.id,base:it.title,tpl:it,extra:false})),...(x.extra||[]).map(e=>({id:e.id,base:e.title,tpl:null,extra:true}))];
  const byId=new Map(all.map(i=>[i.id,i]));let ord;
  if(x.order&&x.order.length){
    ord=x.order.filter(id=>byId.has(id)).map(id=>byId.get(id));const seen=new Set(ord.map(i=>i.id));
    all.forEach((it,ix)=>{if(seen.has(it.id))return;let pos=ord.length;for(let j=ix-1;j>=0;j--){const k=ord.findIndex(o=>o.id===all[j].id);if(k>=0){pos=k+1;break}}ord.splice(pos,0,it);seen.add(it.id)});
  }else ord=all;
  ord=ord.map(i=>{const s=st[i.id]||{};const c=s.c==='n'?'':(s.c||(i.tpl&&i.tpl.ex?'x':''));return{...i,st:{...s,c},title:s.t||i.base,renamed:!!s.t}});
  const vis0=ord.filter(i=>!hidden.has(i.id));
  return{vis:[...vis0.filter(i=>!i.st.c),...vis0.filter(i=>i.st.c==='v'),...vis0.filter(i=>i.st.c==='x')],hid:ord.filter(i=>hidden.has(i.id)),all:ord,custom:!!(x.order&&x.order.length),off:!x.on};
}
function prog(site,cat){const m=merged(site,cat).vis;let v=0,xx=0;m.forEach(i=>{if(i.st.c==='v')v++;else if(i.st.c==='x')xx++});return{v,x:xx,t:m.length,left:m.length-v-xx}}

/* ---------- 화면 ---------- */
function route(){const h=location.hash.slice(1);if(h==='setup')return{v:'setup'};if(h.startsWith('s-')&&sites.has(h.slice(2)))return{v:'site',id:h.slice(2)};return{v:'home'}}
function render(){
  if(ui.dragging){ui.needRender=true;return}
  const ae=document.activeElement;let keep=null;
  if(ae&&ae.id&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)&&ae.type!=='file')keep={id:ae.id,v:ae.value,s:ae.selectionStart,e:ae.selectionEnd};
  app.dataset.view=route().v;app.innerHTML=view();
  attachSortables();
  fitMemos();
  if(keep){const el=document.getElementById(keep.id);if(el){el.value=keep.v;el.focus({preventScroll:true});try{el.setSelectionRange(keep.s,keep.e)}catch(_){}}}
}
function view(){
  if(fatal)return `<div class="empty">${esc(fatal)}</div>`;
  if(!gotCats||!gotSites)return `<div class="empty">${slow?'저장소 연결이 늦어지고 있어요. 인터넷 연결을 확인해주세요.':'불러오는 중이에요…'}</div>`;
  const r=route();return r.v==='setup'?vSetup():r.v==='site'?vSite(r.id):vHome();
}
const SITE_MODE=true;
const JSZIP='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
function eachFile(catsObj,sitesObj,fn){
  for(const c of Object.values(catsObj)){(c.guides||[]).forEach(fn);(c.items||[]).forEach(i=>(i.examples||[]).forEach(fn))}
  for(const s of Object.values(sitesObj))for(const k in s.cats||{})for(const i in (s.cats[k].st||{}))(s.cats[k].st[i].f||[]).forEach(fn);
}
async function exportAll(){
  if(!downloads){toast('이 화면에서는 내려받을 수 없어요.');return}
  try{
    await loadScript(JSZIP);const z=new JSZip();
    const cO=Object.fromEntries([...cats].map(([k,v])=>[k,strip(v)])),sO=Object.fromEntries([...sites].map(([k,v])=>[k,strip(v)]));
    const fm=new Map();eachFile(cO,sO,f=>{if(f&&f.a)fm.set(f.a,f)});
    let i=0,miss=0;for(const f of fm.values()){toast(`파일 모으는 중 ${++i}/${fm.size}`,120000);try{z.file('files/'+f.a,await fileBlob(f))}catch(_){miss++}}
    z.file('data.json',JSON.stringify({v:1,cats:cO,sites:sO,files:[...fm.values()].map(f=>({a:f.a,m:f.m,n:f.n}))}));
    toast('압축하는 중…',120000);const blob=await z.generateAsync({type:'blob',compression:'STORE'});
    const d=new Date(),zz=n=>String(n).padStart(2,'0');
    await downloads.save({filename:`현장서류함_전체_${d.getFullYear()}${zz(d.getMonth()+1)}${zz(d.getDate())}.zip`,data:blob});
    toast(miss?`내려받았어요. 파일 ${miss}개는 찾지 못했어요.`:'내려받았어요.',4000);
  }catch(e){toast(errMsg(e))}
}
async function importAll(file){
  if(!await confirmBox('내보낸 zip의 현장·목차·서류를 이 페이지로 가져올까요? 같은 현장과 목차는 zip 내용으로 바뀌어요.','가져오기'))return;
  try{
    await loadScript(JSZIP);const z=await JSZip.loadAsync(file);const ent=z.file('data.json');if(!ent){toast('현장 서류함에서 내보낸 zip이 아니에요.');return}
    const data=JSON.parse(await ent.async('string'));const cO=data.cats||{},sO=data.sites||{};const metas=data.files||[];
    let i=0;for(const m of metas){toast(`서류 올리는 중 ${++i}/${metas.length}`,120000);const e=z.file('files/'+m.a);if(!e)continue;
      try{await assets.upload(new Blob([await e.async('arraybuffer')],{type:m.m}),{type:m.m,id:m.a})}catch(er){toast((m.n||'')+': '+errMsg(er),4000)}}
    eachFile(cO,sO,f=>{f.e='raw'});
    for(const[k,v]of Object.entries(cO)){await db.doc('cats/'+k).set(v)}
    for(const[k,v]of Object.entries(sO)){await db.doc('sites/'+k).set(v)}
    toast(`가져왔어요. 현장 ${Object.keys(sO).length}곳, 서류 ${metas.length}개`,5000);
  }catch(e){toast('가져오지 못했어요. '+errMsg(e),5000)}
}
let draft=null;
const S=()=>draft?draft.cats:cats;
function D(){if(!draft)draft={cats:new Map([...cats].map(([k,v])=>[k,clone(v)])),del:new Set(),dirty:false};return draft}
function mutD(cid,fn,noRender){const d=D();const c=d.cats.get(cid);if(!c)return;if(!c.items)c.items=[];const was=d.dirty;fn(c);d.dirty=true;if(!noRender||!was)render()}
const norm=c=>JSON.stringify({name:c.name,order:c.order||0,items:(c.items||[]).map(i=>({id:i.id,title:i.title,note:i.note||'',ex:!!i.ex,examples:i.examples||[]})),guides:c.guides||[],memo:c.memo||''});
async function saveDraft(){
  if(!draft)return;const d=draft;draft=null;
  for(const[id,c]of d.cats){const real=cats.get(id);const rmap=new Map(((real&&real.items)||[]).map(i=>[i.id,i]));
    const doc={name:c.name,order:c.order||0,items:(c.items||[]).map(i=>({id:i.id,title:i.title,note:i.note||'',ex:!!i.ex,examples:(rmap.get(i.id)||{}).examples||[]})),guides:(real&&real.guides)||[],memo:(real&&real.memo)||''};
    if(!real||norm(doc)!==norm(real)){cats.set(id,{...doc,id});queueWrite('cats/'+id,doc)}
    const gone=((real&&real.items)||[]).filter(i=>!doc.items.some(x=>x.id===i.id));for(const i of gone)for(const f of i.examples||[]){try{await assets.delete(f.a)}catch(_){}}}
  for(const id of d.del){const real=cats.get(id);const files=real?[...(real.guides||[]),...(real.items||[]).flatMap(i=>i.examples||[])]:[];cats.delete(id);try{await db.doc('cats/'+id).delete()}catch(e){toast(errMsg(e))}for(const f of files){try{await assets.delete(f.a)}catch(_){}}}
  render();toast('저장했어요. 모든 현장에 반영됐어요.');
}
function attachSortables(){
  if(!window.Sortable)return;
  app.querySelectorAll('[data-sort]').forEach(el=>{const o={animation:150,forceFallback:true,fallbackTolerance:5,delay:280,delayOnTouchOnly:true,touchStartThreshold:6,
    filter:'input,textarea,label,.ck,.btn',preventOnFilter:false,ghostClass:'drag-ghost',chosenClass:'drag-chosen',fallbackClass:'drag-float',
    onStart(){ui.dragging=true},onEnd(){ui.dragging=false;const ids=[...el.children].map(li=>li.dataset.id||li.dataset.item).filter(Boolean);reorderFrom(el.dataset.sort,ids);ui.needRender=false;render()}};
    if(el.dataset.handle)o.handle=el.dataset.handle;Sortable.create(el,o)});
}
function reorderFrom(kind,ids){
  const fill=(full,vis)=>{const vs=new Set(vis);const q=ids.slice();return full.map(id=>vs.has(id)?q.shift():id)};
  if(kind==='sites'){const cid=ui.homeCat;const full=[...sites.values()].filter(x=>inCat(x,cid)).sort((a,c)=>posKey(a,cid)-posKey(c,cid)).map(x=>x.id);
    fill(full,ids).forEach((id,k)=>{if(((sites.get(id).cats||{})[cid]||{}).pos!==k)mutSite(id,x=>{sc(x,cid).pos=k},{render:false})})}
  else if(kind==='site-items'){const sid=curSiteId(),cid=curCatId();const m=merged(sites.get(sid),cats.get(cid));const n=fill(m.all.map(i=>i.id),m.vis.map(i=>i.id));mutSite(sid,x=>{sc(x,cid).order=n},{render:false})}
  else if(kind==='cats'){ids.forEach((id,k)=>{const c=cats.get(id);if(c&&c.order!==k+1)mutCat(id,x=>{x.order=k+1},{render:false});if(draft&&draft.cats.get(id))draft.cats.get(id).order=k+1})}
  else if(kind==='cats-draft'){const d=D();ids.forEach((id,k)=>{const c=d.cats.get(id);if(c)c.order=k+1});d.dirty=true}
  else if(kind==='tpl'){const cid=(S().get(ui.setCat)||catList(S())[0]).id;mutD(cid,c=>{const by=new Map(c.items.map(i=>[i.id,i]));c.items=ids.map(id=>by.get(id)).filter(Boolean).concat(c.items.filter(i=>!ids.includes(i.id)))},true)}
}
function posKey(s,cid){const v=((s.cats||{})[cid]||{}).pos;return typeof v==='number'?v:-(s.created||0)}
let sample=null,sampleImg=null;
const numOf=t=>{const m=/^\s*(\d+)\s*[.)]/.exec(t||'');return m?Number(m[1]):null};
const normT=t=>String(t||'').replace(/^\s*\d+\s*[.)]\s*/,'').replace(/[\s·()（）\/-]/g,'').toLowerCase();
async function readIndex(cid,f){
  const c=cats.get(cid);if(!c||!sample)return;
  const m=document.createElement('div');m.className='modal';layer.appendChild(m);
  m.innerHTML=`<div class="sheet" role="dialog"><div class="sh"><b>‘${esc(c.name)}’ 목차 읽는 중</b><button class="btn sm" data-r="x">취소</button></div><div class="sb"><span class="muted">그림에서 서류 목록을 찾고 있어요. 10~30초 정도 걸려요…</span></div></div>`;
  const ctl=new AbortController();m.addEventListener('click',e=>{if(e.target.closest('[data-r="x"]')){ctl.abort();m.remove()}});
  let out;
  try{

function readB64(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=no;r.readAsDataURL(file)})}
const MIME_BY_EXT={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp'};
async function uploadOne(file){
  let m=file.type||MIME_BY_EXT[ext(file.name)]||'application/octet-stream';
  if(MIME_BY_EXT[ext(file.name)]&&RAW.has(MIME_BY_EXT[ext(file.name)]))m=MIME_BY_EXT[ext(file.name)];
  if(file.size>30*1048576)throw{code:'too_large'};
  const r=await assets.upload(file,{type:m});return{a:r.id,n:file.name,s:file.size,m,e:'raw',t:Date.now()};
}
async function uploadFiles(list,onDone){
  if(!assets){toast('이 화면에서는 서류를 올릴 수 없어요.');return}
  for(const f of list){toast('올리는 중… '+f.name,60000);try{const meta=await uploadOne(f);onDone(meta);toast('올렸어요: '+f.name)}catch(e){toast(f.name+': '+errMsg(e),4000)}}

function findFile(a){

  for(const s of sites.values())for(const k in s.cats||{})for(const i in s.cats[k].st||{})for(const f of s.cats[k].st[i].f||[])if(f.a===a)return f;

  async function pageLabel(pg){try{const tc=await pg.getTextContent();let best='',bs=0;let line='';
      for(const it of tc.items){const t=(it.str||'').trim();if(!t)continue;const sz=Math.abs(it.transform?it.transform[0]:0);if(sz>bs&&t.length>=2){bs=sz;best=t}if(line.length<40)line+=(line?' ':'')+t}

    const boxes=[...body.querySelectorAll('.thumb')];

      try{const pg=await pdf.getPage(i);const v0=pg.getViewport({scale:1});const tw=150,dpr=Math.min(2,window.devicePixelRatio||1);const vp=pg.getViewport({scale:tw/v0.width*dpr});

  }
  async function go(n){

const FB_BASE=['buildingSupportTracker','siteDocs'];
const CHUNK=700*1024;
async function fbInit(){
  const A=await import('https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js');
  const F=await import('https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js');
  const app=A.getApps().length?A.getApp():A.initializeApp(FB_CONFIG);const fs=F.getFirestore(app);
  const wrapSnap=s=>({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()})),size:s.size,empty:s.empty,metadata:{fromCache:s.metadata.fromCache,hasPendingWrites:s.metadata.hasPendingWrites}});
  db={collection(name){const ref=F.collection(fs,...FB_BASE,...name.split('/'));return{onSnapshot(next,err){return F.onSnapshot(ref,s=>next(wrapSnap(s)),e=>err&&err(e))}}},
      doc(path){const ref=F.doc(fs,...FB_BASE,...path.split('/'));return{set:d=>F.setDoc(ref,JSON.parse(JSON.stringify(d))),delete:()=>F.deleteDoc(ref),get:()=>F.getDoc(ref)}}};
  const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
  const unb64=t=>{const bin=atob(t);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
  const cache=new Map();
  assets={
    async upload(blob,opt){opt=opt||{};const id=opt.id||Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');
      const u8=new Uint8Array(await blob.arrayBuffer());const n=Math.max(1,Math.ceil(u8.length/CHUNK));
      for(let i=0;i<n;i++)await F.setDoc(F.doc(fs,...FB_BASE,'files',id,'chunks',String(i).padStart(4,'0')),{d:b64(u8.subarray(i*CHUNK,(i+1)*CHUNK))});
      await F.setDoc(F.doc(fs,...FB_BASE,'files',id),{type:opt.type||blob.type||'application/octet-stream',size:u8.length,n,t:Date.now()});
      cache.set(id,new Blob([u8],{type:opt.type||blob.type}));return{id,url:null,sizeBytes:u8.length,contentType:opt.type||blob.type}},
    async get(id,type){if(cache.has(id))return cache.get(id);
      const meta=await F.getDoc(F.doc(fs,...FB_BASE,'files',id));if(!meta.exists())throw new Error('missing');
      const cs=await F.getDocs(F.collection(fs,...FB_BASE,'files',id,'chunks'));const parts=cs.docs.sort((x,y)=>x.id.localeCompare(y.id)).map(d=>unb64(d.data().d));
      const b=new Blob(parts,{type:meta.data().type||type});cache.set(id,b);return b},

  };
  downloads={async save({filename,data}){const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);return{status:'saved'}}};
}

      if(!seeded&&!cats.size&&!sites.size){seeded=true;(async()=>{toast('처음 열어서 기존 기록을 넣는 중…',60000);try{for(const[k,v]of Object.entries(SEED.cats))await db.doc('cats/'+k).set(v);for(const[k,v]of Object.entries(SEED.sites))await db.doc('sites/'+k).set(v);toast('기존 기록을 넣었어요. 서류 파일은 ‘가져오기’로 zip을 올려주세요.',6000)}catch(e){toast('기존 기록을 넣지 못했어요. '+errMsg(e),6000)}})()}}
    render()};
  db.collection('cats').onSnapshot(snap=>{const n=new Map();snap.docs.forEach(d=>{const p='cats/'+d.id;n.set(d.id,pending(p)&&cats.has(d.id)?cats.get(d.id):{...d.data(),id:d.id})});for(const[k,v]of cats)if(!n.has(k)&&pending('cats/'+k))n.set(k,v);cats=n;if(!snap.metadata.fromCache)gotCats=true;else if(snap.size)gotCats=true;done()},fail);
  db.collection('sites').onSnapshot(snap=>{const n=new Map();snap.docs.forEach(d=>{const p='sites/'+d.id;n.set(d.id,pending(p)&&sites.has(d.id)?sites.get(d.id):{...d.data(),id:d.id})});for(const[k,v]of sites)if(!n.has(k)&&pending('sites/'+k))n.set(k,v);sites=n;if(!snap.metadata.fromCache)gotSites=true;else if(snap.size)gotSites=true;done()},fail);
})();
})();
</script>
